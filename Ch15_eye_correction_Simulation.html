<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Myopia & Hyperopia">
<title>Myopia & Hyperopia Simulation with Correction</title>
<style>
  :root {
    --primary: #1a365d;
    --accent: #2b6cb0;
    --bg: #f7fafc;
    --card: #ffffff;
    --text: #2d3748;
    --muted: #718096;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 20px;
    max-width: 960px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 1.55rem;
    color: var(--primary);
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
  }
  .main-card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07);
    padding: 22px;
    margin-bottom: 18px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
    justify-content: center;
  }
  .btn-group {
    display: flex;
    gap: 8px;
    background: #edf2f7;
    padding: 6px;
    border-radius: 8px;
  }
  button {
    border: none;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
    color: var(--text);
    min-height: 44px;
    -webkit-tap-highlight-color: transparent;
  }
  button.active {
    background: var(--accent);
    color: white;
  }
  button:hover:not(.active) {
    background: #e2e8f0;
  }
  #canvas-container {
    background: #edf2f7;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }
  canvas {
    max-width: 100%;
    height: auto;
    border-radius: 4px;
  }
  .explanation {
    background: #ebf8ff;
    border-left: 4px solid var(--accent);
    padding: 14px 16px;
    border-radius: 0 6px 6px 0;
    font-size: 0.95rem;
  }
  .explanation strong { color: var(--primary); }
  .key-points {
    margin-top: 14px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  footer {
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 12px;
  }
  @media (max-width: 600px) {
    .controls { flex-direction: column; align-items: stretch; }
    .btn-group { justify-content: center; }
  }
</style>
</head>
<body>
<header>
  <h1>Simulation of Myopia & Hyperopia</h1>
  <p class="subtitle">Myopia: distant object (parallel rays) &nbsp;·&nbsp; Hyperopia: near object (diverging rays)</p>
</header>
<div class="main-card">
  <div class="controls">
    <div class="btn-group" id="defectGroup">
      <button class="active" data-defect="myopia">Myopia (Short-sighted)</button>
      <button data-defect="hyperopia">Hyperopia (Long-sighted)</button>
    </div>
    <div class="btn-group" id="correctionGroup">
      <button class="active" data-correction="off">Without Glasses</button>
      <button data-correction="on">With Corrective Glasses</button>
    </div>
  </div>
  <div id="canvas-container">
    <canvas id="eyeCanvas" width="780" height="380"></canvas>
  </div>
  <div class="explanation" id="explanationBox">Loading...</div>
  <div class="key-points" id="keyPoints"></div>
</div>
<footer>
  Simplified optical model. Distant objects send almost parallel rays; a nearby object sends diverging rays.
</footer>
<script>
  const canvas = document.getElementById('eyeCanvas');
  const ctx = canvas.getContext('2d');
  const explanationEl = document.getElementById('explanationBox');
  const keyPointsEl = document.getElementById('keyPoints');

  let currentDefect = 'myopia';
  let correctionOn = false;

  document.querySelectorAll('#defectGroup button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#defectGroup button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentDefect = btn.dataset.defect;
      draw();
    });
  });

  document.querySelectorAll('#correctionGroup button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#correctionGroup button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      correctionOn = btn.dataset.correction === 'on';
      draw();
    });
  });

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#edf2f7';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx = 420;
    const cy = 190;
    const eyeRadius = 130;

    // === Eyeball ===
    ctx.beginPath();
    ctx.arc(cx, cy, eyeRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#4a5568';
    ctx.lineWidth = 3;
    ctx.stroke();

    // === Cornea (original full ellipse version) ===
    ctx.beginPath();
    ctx.ellipse(cx - eyeRadius + 18, cy, 28, 55, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(190, 227, 248, 0.6)';
    ctx.fill();
    ctx.strokeStyle = '#2b6cb0';
    ctx.lineWidth = 2;
    ctx.stroke();

    // === Retina ===
    ctx.beginPath();
    ctx.arc(cx, cy, eyeRadius - 4, -1.1, 1.1);
    ctx.strokeStyle = '#c53030';
    ctx.lineWidth = 8;
    ctx.stroke();

    // Label – Retina (moved higher and further right so it is not blocked)
    ctx.fillStyle = '#c53030';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Retina', cx + eyeRadius + 8, cy - 55);

    // === Corrective lens (if on) ===
    if (correctionOn) {
      const lensX = cx - eyeRadius - 70;

      if (currentDefect === 'myopia') {
        // Concave (diverging) lens – thin in middle
        ctx.beginPath();
        ctx.moveTo(lensX - 16, cy - 58);
        ctx.quadraticCurveTo(lensX + 10, cy, lensX - 16, cy + 58);
        ctx.lineTo(lensX + 4, cy + 58);
        ctx.quadraticCurveTo(lensX - 30, cy, lensX + 4, cy - 58);
        ctx.closePath();

        ctx.fillStyle = 'rgba(183, 148, 246, 0.55)';
        ctx.fill();
        ctx.strokeStyle = '#6b46c1';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = '#6b46c1';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Concave Lens', lensX - 6, cy + 78);
        ctx.font = '12px sans-serif';
        ctx.fillText('(Diverging)', lensX - 6, cy + 95);
      } else {
        // Convex (converging) lens
        ctx.beginPath();
        ctx.ellipse(lensX, cy, 14, 55, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(183, 148, 246, 0.5)';
        ctx.fill();
        ctx.strokeStyle = '#6b46c1';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = '#6b46c1';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Convex Lens', lensX, cy + 78);
        ctx.font = '12px sans-serif';
        ctx.fillText('(Converging)', lensX, cy + 95);
      }
    }

    // === Light rays ===
    const startX = 40;
    const rayYs = [cy - 45, cy - 15, cy + 15, cy + 45];
    ctx.lineWidth = 2;

    if (currentDefect === 'myopia') {
      drawDistantObjectLabel(startX, cy);
      if (!correctionOn) {
        drawRaysMyopiaUncorrected(startX, rayYs, cx, cy, eyeRadius);
      } else {
        drawRaysMyopiaCorrected(startX, rayYs, cx, cy, eyeRadius);
      }
    } else {
      if (!correctionOn) {
        drawRaysHyperopiaUncorrected(startX, rayYs, cx, cy, eyeRadius);
      } else {
        drawRaysHyperopiaCorrected(startX, rayYs, cx, cy, eyeRadius);
      }
    }

    // Title
    ctx.fillStyle = '#1a365d';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    const title = currentDefect === 'myopia'
      ? (correctionOn ? 'Myopia – Corrected with Concave Lens' : 'Myopia – Uncorrected')
      : (correctionOn ? 'Hyperopia – Corrected with Convex Lens' : 'Hyperopia – Uncorrected');
    ctx.fillText(title, canvas.width / 2, 28);

    updateText();
  }

  function drawDistantObjectLabel(startX, cy) {
    ctx.fillStyle = '#1a365d';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Distant object', startX, cy - 70);
    ctx.fillText('(parallel rays)', startX, cy - 54);
  }

  function drawNearObject(objX, cy) {
    // Small near-object marker (a letter on a page)
    ctx.fillStyle = '#2d3748';
    ctx.fillRect(objX - 14, cy - 22, 20, 28);
    ctx.fillStyle = '#fff';
    ctx.fillRect(objX - 12, cy - 20, 16, 24);
    ctx.fillStyle = '#1a365d';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('A', objX - 4, cy + 2);
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Near object', objX - 14, cy - 70);
    ctx.fillText('(diverging rays)', objX - 14, cy - 54);
  }

  function drawRaysMyopiaUncorrected(startX, rayYs, cx, cy, eyeRadius) {
    const focusX = cx + 35;
    rayYs.forEach((y) => {
      ctx.beginPath();
      ctx.strokeStyle = '#3182ce';
      ctx.moveTo(startX, y);
      ctx.lineTo(cx - eyeRadius + 18, y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx - eyeRadius + 18, y);
      ctx.lineTo(focusX, cy);
      ctx.stroke();

      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.moveTo(focusX, cy);
      ctx.lineTo(cx + eyeRadius - 10, cy + (y - cy) * 0.7);
      ctx.stroke();
      ctx.setLineDash([]);
    });

    // Focus marker + label (moved below and slightly left)
    ctx.beginPath();
    ctx.arc(focusX, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#c53030';
    ctx.fill();
    ctx.fillStyle = '#c53030';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Focus (in front of retina)', focusX, cy + 28);
  }

  function drawRaysMyopiaCorrected(startX, rayYs, cx, cy, eyeRadius) {
    const lensX = cx - eyeRadius - 70;
    const focusX = cx + eyeRadius - 8;

    rayYs.forEach((y) => {
      ctx.beginPath();
      ctx.strokeStyle = '#3182ce';
      ctx.moveTo(startX, y);
      ctx.lineTo(lensX - 12, y);
      ctx.stroke();

      const midY = cy + (y - cy) * 1.35;
      ctx.beginPath();
      ctx.moveTo(lensX - 12, y);
      ctx.lineTo(cx - eyeRadius + 18, midY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx - eyeRadius + 18, midY);
      ctx.lineTo(focusX, cy);
      ctx.stroke();
    });

    // Focus marker + label (moved below)
    ctx.beginPath();
    ctx.arc(focusX, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#2f855a';
    ctx.fill();
    ctx.fillStyle = '#2f855a';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Focus on retina', focusX, cy + 28);
  }

  function drawRaysHyperopiaUncorrected(startX, rayYs, cx, cy, eyeRadius) {
    const objX = 52;
    const corneaX = cx - eyeRadius + 18;
    const focusX = cx + eyeRadius + 55;
    drawNearObject(objX, cy);

    rayYs.forEach((y) => {
      // Rays leave one nearby point and spread — they are not parallel
      ctx.beginPath();
      ctx.strokeStyle = '#3182ce';
      ctx.moveTo(objX + 8, cy);
      ctx.lineTo(corneaX, y);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(corneaX, y);
      ctx.lineTo(cx + eyeRadius - 5, cy + (y - cy) * 0.4);
      ctx.stroke();

      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.moveTo(cx + eyeRadius - 5, cy + (y - cy) * 0.4);
      ctx.lineTo(focusX, cy);
      ctx.stroke();
      ctx.setLineDash([]);
    });

    ctx.beginPath();
    ctx.arc(focusX, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#c53030';
    ctx.fill();
    ctx.fillStyle = '#c53030';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Focus (behind retina)', focusX, cy + 28);
  }

  function drawRaysHyperopiaCorrected(startX, rayYs, cx, cy, eyeRadius) {
    const objX = 52;
    const lensX = cx - eyeRadius - 70;
    const corneaX = cx - eyeRadius + 18;
    const focusX = cx + eyeRadius - 8;
    drawNearObject(objX, cy);

    rayYs.forEach((y) => {
      // Diverging rays from the near object hit the convex lens
      ctx.beginPath();
      ctx.strokeStyle = '#3182ce';
      ctx.moveTo(objX + 8, cy);
      ctx.lineTo(lensX - 12, y);
      ctx.stroke();

      // Convex lens adds convergence, so the bundle is less diverging after the lens
      const midY = cy + (y - cy) * 0.55;
      ctx.beginPath();
      ctx.moveTo(lensX - 12, y);
      ctx.lineTo(corneaX, midY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(corneaX, midY);
      ctx.lineTo(focusX, cy);
      ctx.stroke();
    });

    ctx.beginPath();
    ctx.arc(focusX, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#2f855a';
    ctx.fill();
    ctx.fillStyle = '#2f855a';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Focus on retina', focusX, cy + 28);
  }

  function updateText() {
    if (currentDefect === 'myopia') {
      if (!correctionOn) {
        explanationEl.innerHTML = `<strong>Myopia (Short-sightedness) – Uncorrected:</strong> The eyeball is too long or the refractive power is too strong. Parallel rays from a distant object converge <strong>in front of the retina</strong>. A blurred image is formed on the retina.`;
        keyPointsEl.innerHTML = `<strong>Key point:</strong> The eye has excess converging power.`;
      } else {
        explanationEl.innerHTML = `<strong>Myopia – Corrected with a Concave (Diverging) Lens:</strong> The concave lens diverges the incoming rays slightly before they enter the eye. This reduces the overall converging power so the rays now meet exactly <strong>on the retina</strong>.`;
        keyPointsEl.innerHTML = `<strong>Key point:</strong> A diverging lens compensates for the excess converging power of the myopic eye.`;
      }
    } else {
      if (!correctionOn) {
        explanationEl.innerHTML = `<strong>Hyperopia (Long-sightedness) – Uncorrected:</strong> A nearby object sends <strong>diverging</strong> rays (not parallel). The eyeball is too short or the refractive power is too weak, so those rays would meet <strong>behind the retina</strong>. A blurred image is formed on the retina — close print cannot be seen clearly.`;
        keyPointsEl.innerHTML = `<strong>Key point:</strong> Near objects need extra converging power. The long-sighted eye does not have enough.`;
      } else {
        explanationEl.innerHTML = `<strong>Hyperopia – Corrected with a Convex (Converging) Lens:</strong> The convex lens adds convergence to the <strong>diverging</strong> rays from the nearby object before they enter the eye. The extra power is enough for the rays to meet exactly <strong>on the retina</strong>.`;
        keyPointsEl.innerHTML = `<strong>Key point:</strong> A converging lens supplies the extra power needed to focus a near object.`;
      }
    }
  }

  draw();
</script>
</body>
</html>
